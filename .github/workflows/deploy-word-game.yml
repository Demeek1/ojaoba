name: Deploy Word Duel to GitHub Pages

# Publishes the word-puzzle-game/ folder as a public website so anyone
# can play from a link. After this runs once, the game lives at:
#   https://<your-username>.github.io/<repo-name>/
# e.g. https://demeek1.github.io/ojaoba/

on:
  push:
    branches: [master]
    paths:
      - "word-puzzle-game/**"
      - ".github/workflows/deploy-word-game.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the game folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "word-puzzle-game"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
